<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çevir Kazan — Pers Learning demo</title>
<style>
:root{--bg:#0d1830;--card:#14233f;--ink:#e8eefb;--mute:#9db0d0;--line:#2a3b5c;--blue:#7db0ff;--btn:#7db0ff;--btn-ink:#06142e;--orange:#f28a1e;--ok:#6fd99a;--okbg:#12301f;--bad:#ff9a90;--badbg:#3a1a1a;--bar:#22324f;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.2}
h1:focus,h2:focus{outline:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:20px 0 6px;flex-wrap:wrap}
.logo{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.logo b{color:var(--blue)}.logo i{color:var(--orange);font-style:normal}
.top span{color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:20px;align-items:start;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
h2{font-size:1.4rem}
p{margin:10px 0 0}
.mute{color:var(--mute)}
.btn{border:0;border-radius:12px;padding:13px 26px;font-weight:700;background:var(--btn);color:var(--btn-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.center{text-align:center}
.cta{margin-top:20px}
.wh{position:relative;width:min(340px,78vw);margin:22px auto 8px}
.wh svg{display:block;width:100%;height:auto;transition:transform 4.2s cubic-bezier(.15,.7,.1,1);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--ink);z-index:2}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-block;padding:4px 14px;border-radius:99px;font-weight:700;font-size:.92rem}
.tm{height:12px;border-radius:99px;background:var(--bar);overflow:hidden;margin:6px 0 4px}
.tb{height:100%;background:var(--ok);width:100%}
.tb.low{background:var(--bad)}
.tn{font-weight:800;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;gap:10px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt em{font-style:normal;font-weight:700;margin-left:auto;white-space:nowrap}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--bar)}
.big{font-size:3.2rem;font-weight:800;color:var(--blue);line-height:1}
.rec{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;text-align:left}
.rec li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--bar);font-size:.92rem}
.rec b{margin-left:auto;white-space:nowrap}
.lb{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bar)}
.lb li.me{outline:2px solid var(--orange);background:var(--card)}
.lb .rk{font-weight:800;color:var(--mute)}
.lb .sc{font-weight:800;font-variant-numeric:tabular-nums}
.lb small{display:block;color:var(--mute)}
.tag{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--orange);color:#10264a;margin-left:6px}
.note{font-size:.85rem;color:var(--mute);margin-top:14px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.wh svg{transition:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="logo" aria-label="Pers Learning"><b>pers</b> <i>learning</i></div><span>Çevir Kazan · Demo</span></div>
 <div class="grid">
  <main class="card" id="stage"></main>
  <aside class="card" id="lb" aria-label="Skor tablosu"></aside>
 </div>
 <p id="live" role="status" style="position:absolute;left:-9999px"></p>
</div>
<script>
var CATS=[
{n:"Satış",c:"#c8183c",t:"#fff",l:["Satış"]},
{n:"Ürün Bilgisi",c:"#0a5cc5",t:"#fff",l:["Ürün","Bilgisi"]},
{n:"Müşteri Deneyimi",c:"#f28a1e",t:"#10264a",l:["Müşteri","Deneyimi"]},
{n:"Perakende Matematiği",c:"#0b7a75",t:"#fff",l:["Perakende","Matematiği"]}];
var QS=[
{c:0,q:"Müşterinin gerçek ihtiyacını anlamak için en etkili soru türü hangisidir?",o:["Evet veya hayır cevabı gerektiren sorular","Açık uçlu sorular","Yalnızca fiyatı soran sorular","Soru sormadan ürün göstermek"],a:1,e:"Açık uçlu sorular müşteriyi konuşturur ve ihtiyacı ortaya çıkarır."},
{c:0,q:"Çapraz satış (cross-sell) nedir?",o:["Ürünü indirimli satmak","Aynı ürünün daha pahalı modelini önermek","Aldığı ürünle birlikte kullanılacak tamamlayıcı ürün önermek","Müşteriyi başka mağazaya yönlendirmek"],a:2,e:"Çapraz satışta ana ürüne uyan tamamlayıcı ürün önerilir. Daha pahalı modeli önermek yukarı satıştır (up-sell)."},
{c:1,q:"Ayak ölçüsü almak için günün hangi saati daha doğru sonuç verir?",o:["Sabah, uyanır uyanmaz","Akşam saatleri","Fark etmez","Gece yarısı"],a:1,e:"Ayaklar gün içinde şişer. Akşam ölçmek, ayakkabının gün boyu rahat kalmasını sağlar."},
{c:1,q:"Müşteri ayakkabıyı denerken hangisi doğru yaklaşımdır?",o:["Sadece tek ayağa giydirip bırakmak","Ayakkabıyı giymeden gözle bakmak","Her zaman bir numara küçük önermek","İki ayağa da giydirip birkaç adım yürümesini istemek"],a:3,e:"İki ayağın ölçüsü farklı olabilir. İki ayakkabıyı giyip yürümek gerçek rahatlığı gösterir."},
{c:2,q:"Şikâyeti olan müşteriye ilk yaklaşım ne olmalı?",o:["Hemen savunma yapmak","Sözünü kesip çözüm sunmak","Sakin kalıp önce dinlemek ve anladığını göstermek","Sorunu başka çalışana devretmek"],a:2,e:"Önce dinlemek ve anlaşıldığını hissettirmek, çözüm konuşmasının zeminini hazırlar."},
{c:2,q:"Müşteri aradığı numarayı bulamadığında en iyi yaklaşım hangisidir?",o:["Alternatif model önermek ve mümkünse başka mağazada stok kontrolü yapmak","“Elimizde yok” deyip bırakmak","Daha sonra tekrar gelmesini söylemek","Başka bir markaya yönlendirmek"],a:0,e:"Çözüm odaklı yaklaşım satışı ve müşteri memnuniyetini birlikte korur."},
{c:3,q:"Mağazaya 200 kişi girdi, 50 kişi alışveriş yaptı. Dönüşüm oranı yüzde kaçtır?",o:["%20","%25","%40","%50"],a:1,e:"Dönüşüm oranı = satış yapılan kişi / giren kişi = 50 / 200 = %25."},
{c:3,q:"40 fişte toplam 120 ürün satıldı. UPT (fiş başına ürün adedi) kaçtır?",o:["2","3","4","30"],a:1,e:"UPT = satılan ürün adedi / fiş sayısı = 120 / 40 = 3."}];
var LIMIT=20,TOTAL=8,S=null,timer=null,ME="Sen";
var SEED=[{n:"Deniz K.",best:1420,ok:8,secs:46},{n:"Ece T.",best:1310,ok:8,secs:61},{n:"Mert A.",best:1180,ok:7,secs:58},{n:"Selin Y.",best:990,ok:6,secs:72},{n:"Can B.",best:840,ok:5,secs:80}];
var $=function(i){return document.getElementById(i)};
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function myBest(){try{return JSON.parse(localStorage.getItem("pers_cark_best")||"null")}catch(e){return null}}

function P(a){var r=a*Math.PI/180;return (150+140*Math.sin(r)).toFixed(1)+" "+(150-140*Math.cos(r)).toFixed(1)}
function wheel(){var h='<svg viewBox="0 0 300 300" id="wheel" role="img" aria-label="Kategori çarkı">';
 CATS.forEach(function(c,i){var a=i*90;
  h+='<path d="M150 150L'+P(a)+'A140 140 0 0 1 '+P(a+90)+'Z" fill="'+c.c+'" stroke="#fff" stroke-width="3"/>';
  h+='<g transform="rotate('+(a+45)+' 150 150)"><text x="150" y="'+(c.l.length>1?62:72)+'" text-anchor="middle" font-size="16" font-weight="700" fill="'+c.t+'">'+
   c.l.map(function(t,k){return '<tspan x="150"'+(k?' dy="19"':'')+'>'+t+'</tspan>'}).join("")+'</text></g>'});
 return h+'<circle cx="150" cy="150" r="16" fill="#fff" stroke="#10264a" stroke-width="3"/></svg>'}

function reset(){S={i:0,cnt:[0,0,0,0],asked:[],res:[],rot:0,total:0,ok:0,secs:0,busy:false,cur:null}}
function intro(){reset();
 $("stage").innerHTML='<h2 tabindex="-1" id="hd">Çevir Kazan</h2>'+
 '<p class="mute">Çarkı çevir, gelen kategorideki soruyu '+LIMIT+' saniyede yanıtla. 4 kategoriden 2’şer, toplam '+TOTAL+' soru.</p>'+
 '<p class="mute">Doğru cevap 100 puan, hızlı cevaba 100 puana kadar bonus. En yüksek skor 1600.</p>'+
 '<div class="wh"><div class="ptr"></div>'+wheel()+'</div><div class="center cta"><button class="btn" id="go">Başla</button></div>'+
 '<p class="note">Bu bir Pers Learning demosudur. Kategoriler, sorular, renkler ve ödül kurumunuza göre uyarlanır; SCORM paketi olarak her LMS’e yüklenir.</p>';
 $("go").onclick=turn}
function turn(){
 if(S.i>=TOTAL)return result();
 $("stage").innerHTML='<div class="meta"><strong>Soru '+(S.i+1)+' / '+TOTAL+'</strong><span class="mute">Puan: <b>'+S.total+'</b></span></div>'+
 '<div class="wh"><div class="ptr"></div>'+wheel()+'</div><div class="center cta"><button class="btn" id="spin">Çarkı çevir</button></div>';
 $("spin").onclick=spin}
function spin(){if(S.busy)return;S.busy=true;$("spin").disabled=true;
 var av=[0,1,2,3].filter(function(i){return S.cnt[i]<2}),ci=av[Math.floor(Math.random()*av.length)];
 var wa=ci*90+45+(Math.random()-.5)*50,T=Math.ceil(S.rot/360)*360+1800+(360-wa);S.rot=T;
 $("wheel").style.transform="rotate("+T+"deg)";
 setTimeout(function(){S.busy=false;S.cnt[ci]++;$("live").textContent="Çark durdu: "+CATS[ci].n;ask(ci)},reduce?300:4400)}
function ask(ci){
 var q=QS.filter(function(x){return x.c===ci&&S.asked.indexOf(x)<0})[0];S.asked.push(q);S.cur={q:q,t0:performance.now()};
 var c=CATS[ci];
 $("stage").innerHTML='<div class="meta"><span class="chip" style="background:'+c.c+';color:'+c.t+'">'+c.n+'</span><span class="mute">Soru '+(S.i+1)+' / '+TOTAL+'</span></div>'+
 '<div class="tm"><div class="tb" id="tb"></div></div><div class="mute" style="font-size:.9rem">Kalan süre: <span class="tn" id="tn">'+LIMIT+'</span> sn</div>'+
 '<h2 tabindex="-1" id="hd" style="margin-top:14px">'+q.q+'</h2><div class="opts">'+
 q.o.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span>'+o+'</span></button>'}).join("")+'</div><div id="fb"></div>';
 document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){answer(+b.dataset.i)}});
 clearInterval(timer);timer=setInterval(function(){
  var rem=Math.max(0,LIMIT-(performance.now()-S.cur.t0)/1000);
  $("tb").style.width=rem/LIMIT*100+"%";$("tb").classList.toggle("low",rem<6);$("tn").textContent=Math.ceil(rem);
  if(rem<=0)answer(-1)},100)}
function answer(i){if(!S.cur||S.cur.done)return;S.cur.done=true;clearInterval(timer);
 var q=S.cur.q,secs=Math.min(LIMIT,(performance.now()-S.cur.t0)/1000),ok=i===q.a,pts=ok?100+Math.round(100*(LIMIT-secs)/LIMIT):0;
 S.total+=pts;S.secs+=(i<0?LIMIT:secs);if(ok)S.ok++;S.res.push({c:q.c,ok:ok,secs:i<0?LIMIT:secs,pts:pts,to:i<0});
 document.querySelectorAll(".opt").forEach(function(b,k){b.disabled=true;
  if(k===q.a){b.classList.add("right");b.insertAdjacentHTML("beforeend","<em>Doğru cevap</em>")}
  else if(k===i){b.classList.add("wrong");b.insertAdjacentHTML("beforeend","<em>Yanlış</em>")}});
 var last=S.i+1>=TOTAL;
 $("fb").innerHTML='<div class="fb"><strong>'+(ok?"Doğru! +"+pts+" puan ("+secs.toFixed(1)+" sn)":i<0?"Süre doldu. 0 puan.":"Yanlış. 0 puan.")+'</strong><p style="margin-top:6px">'+q.e+'</p></div>'+
  '<div class="center cta"><button class="btn" id="nx">'+(last?"Sonucu gör":"Çarkı çevir")+'</button></div>';
 $("nx").onclick=function(){S.i++;turn()};$("nx").focus({preventScroll:true})}
function result(){
 var old=myBest(),isBest=!old||S.total>old.best;
 if(isBest){try{localStorage.setItem("pers_cark_best",JSON.stringify({best:S.total,ok:S.ok,secs:Math.round(S.secs)}))}catch(e){}}
 $("stage").innerHTML='<div class="center"><div class="big">'+S.total+'</div><p class="mute" style="margin-top:4px">toplam puan (en fazla 1600)</p>'+
 '<h2 tabindex="-1" id="hd" style="margin-top:10px">'+S.ok+' / '+TOTAL+' doğru</h2><p class="mute">Toplam süre: '+S.secs.toFixed(1)+' sn'+(isBest?' · Yeni rekorun!':'')+'</p></div>'+
 '<ul class="rec">'+S.res.map(function(r,k){return '<li><span>'+(k+1)+'. '+CATS[r.c].n+'</span><span class="mute">'+(r.to?"süre doldu":r.secs.toFixed(1)+" sn")+'</span><b style="color:var(--'+(r.ok?"ok":"bad")+')">'+(r.ok?"Doğru":"Yanlış")+' · '+r.pts+'</b></li>'}).join("")+'</ul>'+
 '<div class="center cta"><button class="btn" id="again">Tekrar oyna</button></div>';
 $("again").onclick=intro;renderLB()}
function renderLB(){
 var rows=SEED.map(function(r){return {n:r.n,best:r.best,ok:r.ok,secs:r.secs}}),m=myBest();
 if(m)rows.push({n:ME,best:m.best,ok:m.ok,secs:m.secs,me:true});
 rows.sort(function(a,b){return b.best-a.best||a.secs-b.secs});
 $("lb").innerHTML='<h2>Skor tablosu</h2><ol class="lb">'+rows.map(function(r,k){return '<li'+(r.me?' class="me"':'')+'><span class="rk">'+(k+1)+'</span><span>'+r.n+(r.me?'<span class="tag">Siz</span>':'')+'<small>'+r.ok+'/'+TOTAL+' doğru, '+r.secs+' sn</small></span><span class="sc">'+r.best+'</span></li>'}).join("")+'</ol>'+
 '<p class="note">Demo tablosu: örnek oyuncular ve sizin bu cihazdaki en iyi skorunuz. Kurum kurulumunda tablo canlı ve ortaktır.</p>'}
intro();renderLB();
</script>
</body>
</html>
